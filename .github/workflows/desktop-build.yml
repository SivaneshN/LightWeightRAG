name: Build desktop installers (unsigned preview)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build one platform, or all platforms
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - linux-ubuntu-x64
          - macos-arm64
          - macos-x64
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'windows-x64' && '{"include":[{"os":"windows-latest","bundle":"nsis","artifact":"windows-x64"}]}' || inputs.platform == 'linux-ubuntu-x64' && '{"include":[{"os":"ubuntu-24.04","bundle":"deb","artifact":"linux-ubuntu-x64"}]}' || inputs.platform == 'macos-arm64' && '{"include":[{"os":"macos-latest","bundle":"app","artifact":"macos-arm64"}]}' || inputs.platform == 'macos-x64' && '{"include":[{"os":"macos-15-intel","bundle":"app","artifact":"macos-x64"}]}' || '{"include":[{"os":"ubuntu-24.04","bundle":"deb","artifact":"linux-ubuntu-x64"},{"os":"windows-latest","bundle":"nsis","artifact":"windows-x64"},{"os":"macos-latest","bundle":"app","artifact":"macos-arm64"},{"os":"macos-15-intel","bundle":"app","artifact":"macos-x64"}]}') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install Python app and bundler dependencies
        working-directory: packaging
        run: python -m pip install -r requirements-desktop.txt

      - name: Package local Python service
        run: python packaging/build_backend.py

      - name: Install Tauri build command
        run: npm install --global "@tauri-apps/cli@^2"

      - name: Generate platform app icons
        working-directory: desktop/src-tauri
        run: tauri icon ../../desktop-ui/app-icon.png --output icons

      - name: Build installer bundles
        working-directory: desktop/src-tauri
        run: tauri build --bundles "${{ matrix.bundle }}" --no-sign --ci

      - name: Create macOS drag-and-drop disk image
        if: matrix.bundle == 'app'
        run: bash packaging/build_macos_dmg.sh "${{ matrix.artifact }}"

      - name: Install and launch the Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "The Windows installer was not created." }
          $installDir = Join-Path $env:RUNNER_TEMP "lwrag-smoke-install"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The Windows installer exited with code $($install.ExitCode)." }
          $searchRoots = @(
            $installDir,
            (Join-Path $env:LOCALAPPDATA "LightWeightRAG"),
            (Join-Path $env:LOCALAPPDATA "Programs/LightWeightRAG"),
            (Join-Path $env:ProgramFiles "LightWeightRAG"),
            (Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "LightWeightRAG")
          ) | Select-Object -Unique
          $appCandidates = foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Filter "*.exe" -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notmatch "uninstall" }
            }
          }
          $appBinary = $appCandidates | Select-Object -First 1
          if (-not $appBinary) {
            $contents = Get-ChildItem -Path $installDir -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            Write-Host "Installer exit code: $($install.ExitCode)"
            Write-Host "Installation directory contents: $($contents -join '; ')"
            throw "The installed desktop app was not found under $installDir."
          }
          $appPath = $appBinary.FullName

          $app = Start-Process -FilePath $appPath -PassThru
          $ready = $false
          $deadline = (Get-Date).AddSeconds(60)
          try {
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:38571/" -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match "LightWeightRAG") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "The installed app did not start its local research service." }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name "LightWeightRAG-backend" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Save Windows and Linux installers
        if: always() && matrix.bundle != 'app'
        uses: actions/upload-artifact@v7
        with:
          name: LightWeightRAG-${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

      - name: Save macOS disk image
        if: matrix.bundle == 'app'
        uses: actions/upload-artifact@v7
        with:
          name: LightWeightRAG-${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/dmg/LightWeightRAG-${{ matrix.artifact }}.dmg
          if-no-files-found: error
          retention-days: 14
