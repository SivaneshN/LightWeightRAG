name: Build desktop installers (unsigned preview)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
            artifact: linux-ubuntu-x64
          - os: windows-latest
            bundle: nsis
            artifact: windows-x64
          - os: macos-latest
            bundle: dmg
            artifact: macos-arm64
          - os: macos-15-intel
            bundle: dmg
            artifact: macos-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install Python app and bundler dependencies
        working-directory: packaging
        run: python -m pip install -r requirements-desktop.txt

      - name: Package local Python service
        run: python packaging/build_backend.py

      - name: Install Tauri build command
        run: cargo install tauri-cli --locked --version "^2.0.0"

      - name: Generate platform app icons
        working-directory: desktop/src-tauri
        run: cargo tauri icon ../../desktop-ui/app-icon.png --output icons

      - name: Build installer bundles
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles "${{ matrix.bundle }}" --no-sign --ci

      - name: Save installer artifacts for review
        uses: actions/upload-artifact@v7
        with:
          name: LightWeightRAG-${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
